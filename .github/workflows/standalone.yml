name: Standalone SDK
on: [push, pull_request]
permissions:
  contents: read
jobs:
  public-tables:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest -r requirements/standalone.txt
      - run: python -m pytest tests/test_standalone_tables.py -q
      - run: python -m py_compile examples/standalone_rotation.py
